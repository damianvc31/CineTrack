name: CineTrack Monthly Actor Photos Sync

on:
  schedule:
    # 04:00 UTC el día 1 de cada mes
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Límite de actores sin foto a procesar'
        required: false
        default: '500'
        type: string

jobs:
  monthly-photos-sync:
    name: Sync Actor Photos
    runs-on: ubuntu-latest
    steps:
      - name: Send Actor Photos Sync Request to Production Backend
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          LIMIT: ${{ inputs.limit || '500' }}
        run: |
          if [ -z "$PROD_API_URL" ] || [ -z "$ADMIN_API_KEY" ]; then
            echo "Error: PROD_API_URL o ADMIN_API_KEY secret no está configurado en GitHub Secrets."
            exit 1
          fi

          API_URL="${PROD_API_URL%/}"

          echo "Disparando sincronización mensual de fotos de actores en $API_URL/api/v1/admin/sync/actor-photos (límite: $LIMIT)..."

          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$API_URL/api/v1/admin/sync/actor-photos" \
            -H "X-Admin-Key: $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"limit\": $LIMIT}")

          echo "Código HTTP recibido: $HTTP_CODE"
          echo "Respuesta del servidor:"
          cat response.txt || true
          echo ""

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 202 ]; then
            echo "Error: El servidor respondió con código HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Sincronización disparada exitosamente. Iniciando monitoreo y keep-alive de Render..."
          START_TIME=$(date +%s)
          TIMEOUT=1800 # 30 minutos

          while true; do
            sleep 15
            ELAPSED=$(( $(date +%s) - START_TIME ))
            STATUS_JSON=$(curl -s -H "X-Admin-Key: $ADMIN_API_KEY" "$API_URL/api/v1/admin/sync/jobs/actor_photos/status")
            echo "[$ELAPSED s] Estado del job: $STATUS_JSON"

            STATUS=$(echo "$STATUS_JSON" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)

            if [ "$STATUS" = "completed" ]; then
              echo "¡Sincronización de fotos de actores completada exitosamente en $ELAPSED segundos!"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo "Error: La sincronización de fotos de actores falló en el servidor."
              exit 1
            fi

            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Error: Se superó el tiempo máximo de espera ($TIMEOUT s)."
              exit 1
            fi
          done
