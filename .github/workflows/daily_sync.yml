name: CineTrack Daily TMDB Sync

on:
  schedule:
    # 03:00 UTC = 00:00 Argentina (UTC-3) - Lunes a Sábado (los Domingos a las 02:00 UTC corre weekly_deep_sync)
    - cron: '0 3 * * 1-6'
  workflow_dispatch:
    inputs:
      allow_unreleased:
        description: 'Permitir títulos no estrenados (default: false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  daily-sync:
    name: Trigger Daily Sync
    runs-on: ubuntu-latest
    steps:
      - name: Send Sync Request to Production Backend
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ALLOW_UNRELEASED: ${{ inputs.allow_unreleased || 'false' }}
        run: |
          if [ -z "$PROD_API_URL" ] || [ -z "$ADMIN_API_KEY" ]; then
            echo "Error: PROD_API_URL o ADMIN_API_KEY secret no está configurado en GitHub Secrets."
            exit 1
          fi

          # Eliminar barra final si existe
          API_URL="${PROD_API_URL%/}"

          echo "Disparando sincronización diaria en $API_URL/api/v1/admin/sync/daily..."

          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$API_URL/api/v1/admin/sync/daily" \
            -H "X-Admin-Key: $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"allow_unreleased\": $ALLOW_UNRELEASED}")

          echo "Código HTTP recibido: $HTTP_CODE"
          echo "Respuesta del servidor:"
          cat response.txt || true
          echo ""

          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 202 ]; then
            echo "Error: El servidor respondió con código HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Sincronización disparada exitosamente. Iniciando monitoreo y keep-alive de Render..."
          START_TIME=$(date +%s)
          TIMEOUT=7200 # 2 horas (tiempo de guardia seguro para sondeo continuo)

          while true; do
            sleep 15
            ELAPSED=$(( $(date +%s) - START_TIME ))
            STATUS_JSON=$(curl -s -H "X-Admin-Key: $ADMIN_API_KEY" "$API_URL/api/v1/admin/sync/jobs/daily_sync/status")
            echo "[$ELAPSED s] Estado del job: $STATUS_JSON"

            STATUS=$(echo "$STATUS_JSON" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)

            if [ "$STATUS" = "completed" ]; then
              echo "¡Sincronización diaria completada exitosamente en $ELAPSED segundos!"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo "Error: La sincronización diaria falló en el servidor."
              exit 1
            fi

            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Error: Se superó el tiempo máximo de espera ($TIMEOUT s)."
              exit 1
            fi
          done
