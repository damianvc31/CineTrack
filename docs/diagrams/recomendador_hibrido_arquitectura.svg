<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1560" width="1180" height="1560" style="background-color: #020617; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- TÍTULO PRINCIPAL -->
  <text x="590" y="32" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">CINETRACK — ARQUITECTURA DEL RECOMENDADOR HÍBRIDO &amp; FACTOR SORPRESA (FASE 11)</text>
  <text x="590" y="52" font-size="12" fill="#94a3b8" text-anchor="middle">Pipeline RAG Multicapa con Control de Variedad, Despachador de Razonamiento y Tolerancia a Fallos Multiclave</text>

  <!-- Conectores / Flechas de Fondo -->
  <g stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Paso 1 a Paso 2 -->
    <path d="M 590 175 L 590 205"/>
    
    <!-- Paso 2 a bifurcación DB (Paso 3) -->
    <path d="M 590 325 L 590 365"/>
    <path d="M 590 365 L 340 365 L 340 405"/>
    <path d="M 590 365 L 840 365 L 840 405"/>
    
    <!-- DB a Pool -->
    <path d="M 340 575 L 340 605 L 590 605 L 590 635"/>
    <path d="M 840 575 L 840 605 L 590 605"/>

    <!-- Pool a Paso 4 (LLM Cascada) -->
    <path d="M 590 735 L 590 770"/>

    <!-- Cascada Nivel 1 -> Nivel 2 -> Nivel 3 -->
    <path d="M 590 1025 L 590 1055"/>
    <path d="M 590 1265 L 590 1295"/>
    <path d="M 590 1410 L 590 1440"/>
  </g>

  <!-- ================= PASO 1: ENTRADA Y VALIDACIÓN ================= -->
  <g transform="translate(140, 70)" filter="url(#shadow)">
    <rect width="900" height="105" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="900" height="30" rx="14" fill="#dc2626"/>
    <rect x="0" y="18" width="900" height="12" fill="#dc2626"/>
    <text x="450" y="21" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PASO 1: ENTRADA UX + VALIDACIÓN &amp; SANITIZACIÓN INMEDIATA</text>
    
    <!-- Payload preview pill -->
    <g transform="translate(30, 38)">
      <rect width="840" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="17" font-size="11.5" fill="#f8fafc"><tspan fill="#38bdf8" font-weight="bold">INPUT:</tspan> Prompt usuario + <tspan fill="#fbbf24" font-weight="bold">Slider Variedad</tspan> [VERY_LOW · LOW · MEDIUM · HIGH · VERY_HIGH] + Historial Vistas/Favoritos</text>
    </g>
    
    <text x="450" y="85" font-size="12" fill="#fca5a5" text-anchor="middle">🛡️ Filtro Determinista (is_unintelligible_prompt): Detecta texto basura/machacado y responde aclaración amigable sin gastar BD ni IA.</text>
  </g>

  <!-- ================= PASO 2: EXTRACCIÓN Y DETECCIÓN ================= -->
  <g transform="translate(140, 205)" filter="url(#shadow)">
    <rect width="900" height="120" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="900" height="30" rx="14" fill="#2563eb"/>
    <rect x="0" y="18" width="900" height="12" fill="#2563eb"/>
    <text x="450" y="21" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PASO 2: EXTRACCIÓN DETERMINISTA DE RESTRICCIONES DURAS &amp; ENTIDADES</text>
    <text x="450" y="54" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">"Películas de ciencia ficción de los 80 sin comedia de David Lynch que no haya visto"</text>
    <text x="450" y="78" font-size="12" fill="#93c5fd" text-anchor="middle">Intención Semántica: "ciencia ficción, espacio" • Década: 1980-1989 • Tipo: movie • Exclusión: Comedia</text>
    <text x="450" y="98" font-size="12" fill="#a7f3d0" text-anchor="middle">⭐ Detección de Entidad Directa: "David Lynch" ➔ Exención automática de filtros de popularidad/rating en Paso 3</text>
  </g>

  <!-- ================= PASO 3: BÚSQUEDA HÍBRIDA & MODULACIÓN POR VARIEDAD ================= -->
  <!-- PostgreSQL Branch Card -->
  <g transform="translate(100, 405)" filter="url(#shadow)">
    <rect width="470" height="170" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="235" y="28" font-size="15" font-weight="bold" fill="#a7f3d0" text-anchor="middle">PostgreSQL / Neon (Producción &amp; Dev)</text>
    <text x="18" y="55" font-size="12.5" fill="#ecfdf5">1. Vectoriza intención: Google embedding (768 dim)</text>
    <text x="18" y="78" font-size="12.5" fill="#ecfdf5">2. Búsqueda pgvector: Titulo.embedding &lt;=&gt; user_vec</text>
    <text x="18" y="101" font-size="12.5" fill="#ecfdf5">3. Multiplicador de votos por Variedad (1.8x a 0.3x)</text>
    <text x="18" y="124" font-size="12.5" fill="#ecfdf5">4. Filtro Aclamados en VERY_LOW: rating_unificado ≥ 7.5</text>
    <text x="18" y="147" font-size="12" fill="#6ee7b7">5. Starvation Guardrail: si candidatos &lt; 3, relaja filtros</text>
  </g>

  <!-- SQLite Branch Card -->
  <g transform="translate(610, 405)" filter="url(#shadow)">
    <rect width="470" height="170" rx="14" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="235" y="28" font-size="15" font-weight="bold" fill="#fde68a" text-anchor="middle">SQLite Local (.env.local / Offline)</text>
    <text x="18" y="55" font-size="12.5" fill="#fef3c7">1. Detecta SQLite: OMITE vectorización automáticamente</text>
    <text x="18" y="78" font-size="12.5" fill="#fef3c7">2. Cero llamadas externas / Cero consumo de cuota</text>
    <text x="18" y="101" font-size="12.5" fill="#fef3c7">3. Búsqueda temática léxica (título, sinopsis, género)</text>
    <text x="18" y="124" font-size="12.5" fill="#fef3c7">4. Modulación de popularidad según nivel de variedad</text>
    <text x="18" y="147" font-size="12" fill="#fde68a">5. Exención de entidades y salvaguarda de candidatos</text>
  </g>

  <!-- Candidatos Pool -->
  <g transform="translate(190, 635)" filter="url(#shadow)">
    <rect width="800" height="100" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="400" y="28" font-size="14" font-weight="bold" fill="#c7d2fe" text-anchor="middle">PASO 3: POOL HÍBRIDO DE CANDIDATOS MODULADO (~20 A 35 TÍTULOS)</text>
    <text x="400" y="52" font-size="12" fill="#e0e7ff" text-anchor="middle">Filtrado por restricciones duras • Modulado por Variedad (votos y rating) • Exento para entidades directas</text>
    <text x="400" y="76" font-size="12" fill="#fbbf24" text-anchor="middle">Directivas Semánticas Inyectadas: VERY_LOW (clásicos masivos) ➔ MEDIUM (balance) ➔ VERY_HIGH (joyas ocultas / cine de culto)</text>
  </g>

  <!-- ================= PASO 4: CASCADA LLM MULTI-NIVEL Y REASONING DISPATCHER ================= -->
  <!-- Nivel 1: Modelos Insignia Principales -->
  <g transform="translate(80, 770)" filter="url(#shadow)">
    <rect width="1020" height="255" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="34" rx="16" fill="#4f46e5"/>
    <rect x="0" y="20" width="1020" height="14" fill="#4f46e5"/>
    <text x="510" y="24" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PASO 4 — NIVEL 1: MODELOS INSIGNIA (Reasoning Dispatcher + Resiliencia Multi-Key)</text>

    <!-- Dispatcher Banner -->
    <g transform="translate(25, 44)">
      <rect width="970" height="32" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
      <text x="485" y="21" font-size="11.5" fill="#e0e7ff" text-anchor="middle">⚡ <tspan fill="#a5b4fc" font-weight="bold">Reasoning Dispatcher (AI_REASONING_MODELS):</tspan> Modelos Reasoning reciben <tspan fill="#fbbf24" font-weight="bold">reasoning_effort</tspan> (low/med/high) y Temperatura (0.7 a 1.2)</text>
    </g>

    <!-- Gemini Principal -->
    <g transform="translate(25, 86)">
      <rect width="470" height="150" rx="12" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
      <text x="235" y="26" font-size="13.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. Google Gemini — Primario (Standard)</text>
      <text x="18" y="55" font-size="12.5" fill="#e0f2fe">⚡ Modelo: gemini-3.6-flash (o configurado en env)</text>
      <text x="18" y="78" font-size="12.5" fill="#e0f2fe">🔑 Key 1 (Activa) ➔ Si da 429/503: Key 2 (Rotación inmediata)</text>
      <text x="18" y="101" font-size="12" fill="#bae6fd">Temperatura modulada dinámicamente según variedad</text>
      <text x="18" y="125" font-size="12" fill="#fca5a5">❌ Si agota ambas keys: Conmuta al modelo insignia de Groq</text>
    </g>

    <!-- Groq Principal -->
    <g transform="translate(525, 86)">
      <rect width="470" height="150" rx="12" fill="#7c2d12" stroke="#ea580c" stroke-width="1.5"/>
      <text x="235" y="26" font-size="13.5" font-weight="bold" fill="#fdba74" text-anchor="middle">2. Groq Cloud — Primario (Reasoning)</text>
      <text x="18" y="55" font-size="12.5" fill="#ffedd5">⚡ Modelo: openai/gpt-oss-120b (LPUs de Groq Cloud)</text>
      <text x="18" y="78" font-size="12.5" fill="#ffedd5">🔑 Key 1 (Activa) ➔ Si da 429/503: Key 2 (Rotación inmediata)</text>
      <text x="18" y="101" font-size="12" fill="#fed7aa">Inyecta reasoning_effort='high' en VERY_HIGH / 'low' en VERY_LOW</text>
      <text x="18" y="125" font-size="12" fill="#fca5a5">❌ Si agota ambas keys: Pasa a Nivel 2 (Fallbacks ligeros)</text>
    </g>
  </g>

  <!-- Nivel 2: Modelos de Respaldo Ligeros -->
  <g transform="translate(80, 1055)" filter="url(#shadow)">
    <rect width="1020" height="210" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="1020" height="32" rx="16" fill="#7c3aed"/>
    <rect x="0" y="18" width="1020" height="14" fill="#7c3aed"/>
    <text x="510" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PASO 4 — NIVEL 2: MODELOS DE RESPALDO LIGEROS (Gemini Fallbacks ➔ Groq Fallbacks)</text>

    <!-- Gemini Fallbacks -->
    <g transform="translate(25, 48)">
      <rect width="470" height="140" rx="12" fill="#0e3d54" stroke="#0ea5e9" stroke-width="1"/>
      <text x="235" y="26" font-size="13.5" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Fallbacks Gemini (con Multi-Key)</text>
      <text x="18" y="55" font-size="12.5" fill="#e0f2fe">1. gemini-flash-lite-latest (ultra liviano y rápido)</text>
      <text x="18" y="78" font-size="12.5" fill="#e0f2fe">2. gemini-3.5-flash-lite (generación de respaldo)</text>
      <text x="18" y="101" font-size="12.5" fill="#e0f2fe">3. gemini-3.8-flash (alta disponibilidad)</text>
      <text x="18" y="124" font-size="12" fill="#bae6fd">Cada modelo evalúa ambas API Keys antes de saltar</text>
    </g>

    <!-- Groq Fallbacks -->
    <g transform="translate(525, 48)">
      <rect width="470" height="140" rx="12" fill="#5c200b" stroke="#f97316" stroke-width="1"/>
      <text x="235" y="26" font-size="13.5" font-weight="bold" fill="#fed7aa" text-anchor="middle">Fallbacks Groq (con Multi-Key)</text>
      <text x="18" y="55" font-size="12.5" fill="#ffedd5">1. openai/gpt-oss-20b (modelo compacto)</text>
      <text x="18" y="78" font-size="12.5" fill="#ffedd5">2. groq/compound-mini (alta tasa de tokens)</text>
      <text x="18" y="101" font-size="12.5" fill="#ffedd5">3. qwen/qwen3.8-27b (razonamiento alternativo)</text>
      <text x="18" y="124" font-size="12" fill="#fed7aa">Cada modelo evalúa ambas API Keys antes de saltar</text>
    </g>
  </g>

  <!-- Nivel 3: Fallback Heurístico Offline -->
  <g transform="translate(190, 1295)" filter="url(#shadow)">
    <rect width="800" height="115" rx="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="400" y="30" font-size="14.5" font-weight="bold" fill="#f1f5f9" text-anchor="middle">PASO 4 — NIVEL 3: FALLBACK HEURÍSTICO DETERMINISTA (GARANTÍA 100% DE RESPUESTA)</text>
    <text x="400" y="56" font-size="12.5" fill="#cbd5e1" text-anchor="middle">Algoritmo matemático local sin llamadas a APIs externas (Cero dependencias y Cero costo)</text>
    <text x="400" y="78" font-size="12.5" fill="#e2e8f0" text-anchor="middle">Ponderación matemática: Afinidad de género + Rating unificado + Factor de Variedad + Popularidad</text>
    <text x="400" y="99" font-size="12" fill="#38bdf8" text-anchor="middle">🛡️ Asegura que CineTrack NUNCA falle, incluso ante caídas masivas de Google o Groq</text>
  </g>

  <!-- ================= PASO 5: RESPUESTA FINAL ================= -->
  <g transform="translate(190, 1440)" filter="url(#shadow)">
    <rect width="800" height="90" rx="16" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="400" y="32" font-size="15" font-weight="bold" fill="#bbf7d0" text-anchor="middle">PASO 5: RESPUESTA JSON FINAL HIDRATADA &amp; PRESENTACIÓN EN UI</text>
    <text x="400" y="56" font-size="13" fill="#dcfce7" text-anchor="middle">TitleCards hidratadas con badges de estreno y streaming • Justificaciones personalizadas según variedad</text>
    <text x="400" y="76" font-size="12" fill="#86efac" text-anchor="middle">Trazabilidad transparente: "model_used", "provider_used" y "variety_level" en cada recomendación</text>
  </g>
</svg>
