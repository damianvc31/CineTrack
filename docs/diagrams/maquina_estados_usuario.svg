<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1380" width="1200" height="1380" style="background-color: #090d16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- ENCABEZADO PRINCIPAL -->
  <text x="600" y="38" font-size="22" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1">CINETRACK — MÁQUINA DE ESTADOS DE USUARIO (BIBLIOTECA)</text>
  <text x="600" y="65" font-size="13" fill="#94a3b8" text-anchor="middle">Interacciones personales de visualización y seguimiento (Watchlist, Siguiendo, Vista, Abandonada y Favoritos)</text>

  <!-- ========================================================================= -->
  <!-- SECCIÓN 1: PELÍCULAS (tipo == 'movie') -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 90)">
    <rect width="1120" height="380" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1120" height="38" rx="16" fill="#1e293b"/>
    <rect x="0" y="20" width="1120" height="18" fill="#1e293b"/>
    <text x="30" y="25" font-size="15" font-weight="bold" fill="#38bdf8">🎬 1. ESTADOS DE PELÍCULAS EN BIBLIOTECA</text>
    <text x="1090" y="25" font-size="12" fill="#94a3b8" text-anchor="end">Sin estados intermedios: la película se ve completa</text>

    <!-- Conectores y Flechas Películas -->
    <!-- SinEstado <-> Watchlist -->
    <path d="M 310 120 L 460 120" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-gold)" fill="none"/>
    <text x="385" y="112" font-size="11" fill="#f59e0b" text-anchor="middle">+ Bookmark</text>
    
    <path d="M 460 150 L 310 150" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)" fill="none"/>
    <text x="385" y="166" font-size="10.5" fill="#94a3b8" text-anchor="middle">Quitar Bookmark</text>

    <!-- Watchlist -> Vista -->
    <path d="M 720 120 L 860 120" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" fill="none"/>
    <text x="790" y="112" font-size="11" fill="#10b981" text-anchor="middle">Marcar Vista (Ojo)</text>

    <!-- SinEstado -> Vista Directo -->
    <path d="M 210 210 L 210 260 L 970 260 L 970 210" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" fill="none"/>
    <text x="590" y="252" font-size="11.5" fill="#10b981" text-anchor="middle">Marcar directamente como Vista (sin pasar por Watchlist)</text>

    <!-- Vista -> SinEstado (Desmarcar Vista) -->
    <path d="M 970 210 L 970 295 L 210 295 L 210 210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-slate)" fill="none"/>
    <text x="590" y="287" font-size="11" fill="#94a3b8" text-anchor="middle">Desmarcar Vista (Ojo tachado / Reset a Sin Estado)</text>

    <!-- Card: SIN ESTADO -->
    <g transform="translate(100, 80)">
      <rect width="210" height="130" rx="12" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
      <rect x="20" y="15" width="170" height="26" rx="13" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="105" y="32" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Sin Estado</text>
      <text x="105" y="65" font-size="11" fill="#94a3b8" text-anchor="middle">Fuera de biblioteca</text>
      <text x="105" y="85" font-size="11" fill="#cbd5e1" text-anchor="middle">Iconos en modo Outline</text>
      <text x="105" y="105" font-size="10" fill="#64748b" text-anchor="middle">Disponible para agregar</text>
    </g>

    <!-- Card: EN WATCHLIST -->
    <g transform="translate(470, 80)">
      <rect width="240" height="130" rx="12" fill="#090d16" stroke="#f59e0b" stroke-width="1.8"/>
      <rect x="20" y="15" width="200" height="26" rx="13" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
      <text x="120" y="32" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">🔖 En Watchlist</text>
      <text x="120" y="65" font-size="11" fill="#fde68a" text-anchor="middle">Icono Bookmark dorado lleno</text>
      <text x="120" y="85" font-size="11" fill="#cbd5e1" text-anchor="middle">Pestaña 'Watchlist' en /library</text>
      <text x="120" y="105" font-size="10.5" fill="#94a3b8" text-anchor="middle">Lista de pendientes por ver</text>
    </g>

    <!-- Card: VISTA -->
    <g transform="translate(860, 80)">
      <rect width="220" height="130" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <rect x="20" y="15" width="180" height="26" rx="13" fill="#022c22" stroke="#34d399" stroke-width="1"/>
      <text x="110" y="32" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">👁️ Vista (Watched)</text>
      <text x="110" y="65" font-size="11" fill="#ecfdf5" text-anchor="middle">Icono Ojo verde lleno</text>
      <text x="110" y="85" font-size="11" fill="#a7f3d0" text-anchor="middle">Pestaña 'Watched' /library</text>
      <text x="110" y="105" font-size="10" fill="#fde047" text-anchor="middle">⚠️ Bookmark bloqueado/oculto</text>
    </g>

    <text x="560" y="355" font-size="11.5" fill="#94a3b8" text-anchor="middle">Regla UX: Una película vista no puede estar en Watchlist simultáneamente. Para volver a Watchlist primero debe desmarcarse.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECCIÓN 2: SERIES (tipo == 'tv') -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 500)">
    <rect width="1120" height="710" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1120" height="38" rx="16" fill="#1e293b"/>
    <rect x="0" y="20" width="1120" height="18" fill="#1e293b"/>
    <text x="30" y="25" font-size="15" font-weight="bold" fill="#a855f7">📺 2. ESTADOS DE SERIES EN BIBLIOTECA &amp; SEGUIMIENTO</text>
    <text x="1090" y="25" font-size="12" fill="#94a3b8" text-anchor="end">Gestión granular de progreso por episodios y temporadas</text>

    <!-- Conectores y Flechas Series -->
    <!-- SinEstado <-> Watchlist -->
    <path d="M 270 120 L 380 120" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-gold)" fill="none"/>
    <text x="325" y="112" font-size="10.5" fill="#f59e0b" text-anchor="middle">+ Bookmark</text>

    <!-- Watchlist -> Siguiendo -->
    <path d="M 520 165 L 520 220" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
    <text x="535" y="195" font-size="10.5" fill="#3b82f6">Marca Ep. 1 o Follow</text>

    <!-- SinEstado -> Siguiendo -->
    <path d="M 175 165 L 175 270 L 370 270" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
    <text x="260" y="262" font-size="10.5" fill="#3b82f6" text-anchor="middle">Marca 1er episodio</text>

    <!-- SinEstado -> Vista (Marcar serie completa) -->
    <path d="M 175 165 L 175 420 L 730 420" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" fill="none"/>
    <text x="350" y="412" font-size="10.5" fill="#10b981">Marca serie entera con Ojo</text>

    <!-- Siguiendo -> Vista (100% de episodios completados) -->
    <path d="M 640 270 L 730 270" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-emerald)" fill="none"/>
    <text x="685" y="260" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">100% Visto</text>

    <!-- Siguiendo -> Abandonada (Abandonar X) -->
    <path d="M 450 325 L 450 495" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" fill="none"/>
    <text x="460" y="415" font-size="11" fill="#f43f5e">Dejar de Seguir (X)</text>
    <text x="460" y="430" font-size="10" fill="#94a3b8">(Conserva eps vistos)</text>

    <!-- Abandonada -> Siguiendo (Reanudar / Follow) -->
    <path d="M 530 495 L 530 325" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
    <text x="540" y="415" font-size="11" fill="#3b82f6">Reanudar / Follow</text>
    <text x="540" y="430" font-size="10" fill="#93c5fd">(o nuevo episodio)</text>

    <!-- Vista -> Siguiendo (Retorno por Nueva Temporada) -->
    <path d="M 850 215 L 850 185 L 560 185 L 560 215" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" fill="none"/>
    <text x="705" y="178" font-size="11" font-weight="bold" fill="#3b82f6" text-anchor="middle">⭐ Se estrena nueva temporada en TMDB (Automático)</text>

    <!-- Vista -> SinEstado (Reset completo) -->
    <path d="M 980 270 L 1050 270 L 1050 590 L 175 590 L 175 165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-slate)"/>
    <text x="612" y="582" font-size="11" fill="#94a3b8" text-anchor="middle">Desmarcar serie completa (Ojo tachado / Reset de todos los episodios a 0)</text>

    <!-- Card 1: SIN ESTADO (SERIES) -->
    <g transform="translate(70, 70)">
      <rect width="200" height="95" rx="10" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
      <text x="100" y="28" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Sin Estado (Serie)</text>
      <text x="100" y="52" font-size="11" fill="#94a3b8" text-anchor="middle">Eps vistos: 0</text>
      <text x="100" y="72" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Fuera de biblioteca</text>
    </g>

    <!-- Card 2: EN WATCHLIST (SERIES) -->
    <g transform="translate(390, 70)">
      <rect width="240" height="95" rx="10" fill="#090d16" stroke="#f59e0b" stroke-width="1.8"/>
      <rect x="20" y="12" width="200" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
      <text x="120" y="28" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">🔖 En Watchlist (Serie)</text>
      <text x="120" y="55" font-size="11" fill="#fde68a" text-anchor="middle">Bookmark activo • Eps vistos: 0</text>
      <text x="120" y="75" font-size="10" fill="#94a3b8" text-anchor="middle">Pestaña 'Watchlist' en /library</text>
    </g>

    <!-- Card 3: SIGUIENDO (IN PROGRESS) -->
    <g transform="translate(380, 220)">
      <rect width="250" height="105" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
      <rect x="20" y="12" width="210" height="24" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
      <text x="125" y="28" font-size="12" font-weight="bold" fill="#dbeafe" text-anchor="middle">▶️ Siguiendo (Following)</text>
      <text x="125" y="55" font-size="11" fill="#93c5fd" text-anchor="middle">Barra segmentada por temporada</text>
      <text x="125" y="73" font-size="10.5" fill="#e0e7ff" text-anchor="middle">0 &lt; Eps vistos &lt; Total emitidos</text>
      <text x="125" y="90" font-size="10" fill="#fde047" text-anchor="middle">⚠️ Bloquea Watchlist</text>
    </g>

    <!-- Card 4: VISTA COMPLETADA -->
    <g transform="translate(740, 220)">
      <rect width="230" height="105" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <rect x="20" y="12" width="190" height="24" rx="12" fill="#022c22" stroke="#34d399" stroke-width="1"/>
      <text x="115" y="28" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">👁️ Vista (Completada)</text>
      <text x="115" y="55" font-size="11" fill="#ecfdf5" text-anchor="middle">100% de episodios emitidos vistos</text>
      <text x="115" y="73" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Pestaña 'Watched' /library</text>
      <text x="115" y="90" font-size="10" fill="#fde047" text-anchor="middle">⚠️ Bloquea Watchlist</text>
    </g>

    <!-- Card 5: ABANDONADA (PAUSED) -->
    <g transform="translate(370, 500)">
      <rect width="280" height="110" rx="12" fill="#311319" stroke="#f43f5e" stroke-width="2"/>
      <rect x="20" y="12" width="240" height="24" rx="12" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
      <text x="140" y="28" font-size="12" font-weight="bold" fill="#ffe4e6" text-anchor="middle">⏸️ Abandonada (Paused)</text>
      <text x="140" y="55" font-size="11" font-weight="bold" fill="#fecdd3" text-anchor="middle">Estado computado / invariante:</text>
      <text x="140" y="73" font-size="10.5" fill="#cbd5e1" text-anchor="middle">estado == null &amp;&amp; episodios_vistos &gt; 0</text>
      <text x="140" y="92" font-size="10.5" fill="#fda4af" text-anchor="middle">Icono de pausa/abandono + Botón Reanudar</text>
    </g>

    <!-- Regla de Abandono y Reanudación -->
    <g transform="translate(680, 480)">
      <rect width="400" height="140" rx="10" fill="#090d16" stroke="#475569" stroke-dasharray="4,4"/>
      <text x="20" y="25" font-size="12" font-weight="bold" fill="#f8fafc">💡 Invariante de Estado 'Abandonada':</text>
      <text x="20" y="47" font-size="11" fill="#cbd5e1">• Si el usuario hace clic en el botón [X] de Siguiendo,</text>
      <text x="20" y="65" font-size="11" fill="#cbd5e1">  se remueve de la lista activa sin borrar sus episodios vistos.</text>
      <text x="20" y="87" font-size="11" fill="#cbd5e1">• CineTrack computa automáticamente 'Abandonada'.</text>
      <text x="20" y="107" font-size="11" fill="#38bdf8">• Con el botón [Reanudar / Follow] o al marcar un nuevo</text>
      <text x="20" y="125" font-size="11" fill="#38bdf8">  episodio, regresa a 'Siguiendo' inmediatamente.</text>
    </g>

    <text x="560" y="680" font-size="11.5" fill="#94a3b8" text-anchor="middle">CineTrack actualiza el orden cronológico de 'Siguiendo' en tiempo real cada vez que se marca un nuevo episodio.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECCIÓN 3: DIMENSIÓN ORTOGONAL DE FAVORITOS (Corazón) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 1230)">
    <rect width="1120" height="110" rx="14" fill="#1c1917" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="32" font-size="15" font-weight="bold" fill="#fda4af">❤️ DIMENSIÓN ORTOGONAL — FAVORITOS (Corazón Dorado / Rubí)</text>
    <text x="30" y="58" font-size="12" fill="#fecdd3">El estado de Favorito es un flag booleano independiente (favorito = true / false) que convive en paralelo con cualquier estado de visualización.</text>
    <text x="30" y="80" font-size="11.5" fill="#cbd5e1">Una obra puede ser Favorita estando Sin Estado, en Watchlist, Siguiendo, Abandonada o Vista. En la biblioteca cuenta con su propia pestaña curada 'Favorites'.</text>
    <text x="1090" y="32" font-size="12" fill="#fda4af" text-anchor="end">POST /api/v1/titles/{id}/favorite</text>
  </g>
</svg>
